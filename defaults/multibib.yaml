reader: markdown
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

filters:
  - include-files.lua
  - pandoc-crossref
  - custom-divs.lua
  - multibib.lua
  - correcciones-notas.lua

template: pandoc.tex
top-level-division: chapter
syntax-highlighting: idiomatic

metadata-files:
  - localizacion.yaml
  - crossref.yaml
  - plantilla.yaml

# Estilo de memoria.sty, del repositorio entorno-latex.
metadata:
  fontfamily: memoria
