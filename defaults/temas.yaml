reader: markdown
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

filters:
  - include-files.lua
  - pandoc-crossref
  - custom-divs.lua
  - multibib.lua
  - correcciones-notas.lua

template: pandoc.tex
syntax-highlighting: idiomatic

metadata-files:
  - comun.yaml
  - crossref.yaml
  - citas.yaml
  - latex.yaml

metadata:
  fontfamily: temas
