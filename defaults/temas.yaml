reader: markdown
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

bibliography: biblioteca.json

filters:
  - include-files.lua
  - pandoc-crossref
  - custom-divs.lua
  - suprimir-citas.lua
  - citeproc
  - dividir-bibliografia.lua
  - ajustes-citeproc.lua

template: pandoc.tex
syntax-highlighting: idiomatic

metadata-files:
  - localizacion.yaml
  - crossref.yaml
  - plantilla.yaml

# Estilo de temas.sty, del repositorio entorno-latex.
metadata:
  fontfamily: temas
