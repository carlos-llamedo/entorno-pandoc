reader: markdown
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

bibliography: biblioteca.json

filters:
  - include-files.lua
  - pandoc-crossref
  - custom-divs.lua
  - citeproc
  - correcciones-notas.lua

template: pandoc.tex
top-level-division: chapter
syntax-highlighting: idiomatic

metadata-files:
  - comun.yaml
  - crossref.yaml
  - citas.yaml
  - latex.yaml
