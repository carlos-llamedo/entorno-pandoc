reader: markdown
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

bibliography: biblioteca.json

filters:
  - include-files.lua
  - pandoc-crossref
  - custom-divs.lua
  - citeproc
  - correcciones-notas.lua

template: pandoc.tex
top-level-division: chapter
syntax-highlighting: idiomatic

metadata:
  lang: es-ES
  listings: true
  figureTitle: "Figura"
  tableTitle: "Cuadro"
  listingTitle: "Listado"
  figPrefix:
    - "fig."
    - "figs."
  tblPrefix:
    - "cuadro"
    - "cuadros"
  lstPrefix:
    - "listado"
    - "listados"
  eqnPrefix:
    - "ec."
    - "ecs."
  lofTitle: "Índice de figuras"
  lotTitle: "Índice de cuadros"
  lolTitle: "Índice de listados"
