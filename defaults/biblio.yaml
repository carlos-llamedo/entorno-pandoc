reader: csljson
writer: pdf
pdf-engine: lualatex

resource-path: 
  - .
  - figuras
  - ${USERDATA}

filters:
  - citeproc

csl: chicago-author-date

template: pandoc.tex
top-level-division: chapter

metadata-files:
  - localizacion.yaml
  - plantilla.yaml

# Estilo de memoria.sty, del repositorio entorno-latex.
# https://github.com/carlos-llamedo/entorno-latex
metadata:
  fontfamily: memoria
  reference-section-title: "Bibliografía"
