reader: markdown
writer: latex
standalone: true

resource-path: 
  - .
  - figuras
  - ${USERDATA}

bibliography: biblioteca.json

filters:
  - include-files.lua
  - pandoc-crossref
  - citeproc
  - dividir-bibliografia.lua
  - ajustes-citeproc.lua

template: pandoc.tex
syntax-highlighting: idiomatic

metadata-files:
  - localizacion.yaml
  - crossref.yaml
  - plantilla.yaml
